{% set name = "landau" %}
{% set version = "1.19.1" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/landau-{{ version }}.tar.gz
  sha256: 20c295d2419ffb74e46e60c5dc6b071b959db1bbc177cd72cb4df691719a87ba

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - matplotlib-base >=3,<4
    - numpy >1,<3
    - pandas >=2.2,<3
    - scipy >=1.11.0,<2
    - shapely >=2.1,<=2.1.2
    - seaborn >=0.12,<=0.13.2
    - scikit-learn >=1.2,<2
    - pyiron_snippets >=1,<2

test:
  imports:
    - landau
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/eisenforschung/landau
  summary: A library to calculate thermodynamic equilibria and plot phase diagrams in the (semi-)grand ensemble.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - srmnitc
    - pmrv
